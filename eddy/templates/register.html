{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
  <section class="card narrow">
    <h1>Create a staff account</h1>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="name">Name</label>
      <input id="name" name="name" type="text" autocomplete="name" maxlength="80" required>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" aria-describedby="password-hint" required>
      <p id="password-hint" class="hint">At least 10 characters.</p>
      <button type="submit" class="button">Create account</button>
    </form>
    <p class="muted">Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a></p>
  </section>
{% endblock %}
